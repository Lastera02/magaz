<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magaz Starter</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <h1>Старт магазина: вход и авторизация</h1>

    <section class="card">
      <h2>Регистрация</h2>
      <form id="register-form">
        <input type="email" id="reg-email" placeholder="Email" required />
        <input type="password" id="reg-password" placeholder="Пароль (минимум 6)" required />
        <button type="submit">Зарегистрироваться</button>
      </form>
    </section>

    <section class="card">
      <h2>Логин</h2>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Пароль" required />
        <button type="submit">Войти</button>
      </form>
    </section>

    <section class="card">
      <h2>Профиль (защищенный маршрут)</h2>
      <button id="profile-btn">Получить профиль</button>
      <button id="logout-btn" class="ghost">Выйти</button>
      <pre id="result">Токен отсутствует</pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
